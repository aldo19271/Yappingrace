name = "yappingrace-ws"
main = "src/index.js"
compatibility_date = "2025-09-01"
keep_vars = true

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Durable Objects versi SQLite (tersedia di plan gratis)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Room"]

[vars]
# Alamat web di Vercel (tanpa garis miring di akhir). WAJIB diisi setelah web ter-deploy.
API_URL = "https://yappingrace.vercel.app"
# Model Gemini. Cek nama model yang masih aktif di Google AI Studio jika kata tidak terbuat.
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Opsional: batasi origin yang boleh konek, pisahkan koma. Contoh: https://yappingrace.vercel.app
# Kosongkan untuk mengizinkan semua.
ALLOWED_ORIGINS = ""

# Secrets (isi lewat dashboard Cloudflare > Worker > Settings > Variables and Secrets, tipe Secret):
#   JWT_SECRET, GAME_SERVER_SECRET, GEMINI_API_KEY
